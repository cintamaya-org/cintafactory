<label style="display:flex; align-items:center; gap:0.65rem; margin:0;">
  <input type="radio"
         name="{{ widget.name }}"
         value="{{ widget.value }}"
         {% if widget.attrs.id %}id="{{ widget.attrs.id }}{% if widget.index %}_{{ widget.index }}{% endif %}"{% endif %}
         class="with-gap"
         {% if widget.selected %}checked{% endif %}
         {% include "django/forms/widgets/attrs.html" %}>
  <span style="color:#263238;">{{ widget.label }}</span>
</label>
