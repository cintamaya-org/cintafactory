global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "cintafactory-web"
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8000"]
        labels:
          service: web

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor
    metric_relabel_configs:
      - source_labels: [id]
        regex: ".*/docker-([a-f0-9]{12}).*"
        target_label: container_id
        replacement: "$1"
