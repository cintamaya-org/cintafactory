groups:
  - name: cinta-platform-alerts
    interval: 30s
    rules:
      - alert: CintaWebMetricsDown
        expr: up{job="cintafactory-web"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Web metrics target is down"
          description: "Prometheus cannot scrape cintafactory-web /metrics for at least 2 minutes."

      - alert: CintaCadvisorDown
        expr: up{job="cadvisor"} == 0
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "cAdvisor target is down"
          description: "Prometheus cannot scrape cAdvisor; capacity panels may be stale."

      - alert: CintaDependencyDown
        expr: cinta_dependency_up == 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Runtime dependency is unhealthy"
          description: "Dependency {{ $labels.dependency }} has been reported down for at least 5 minutes."

      - alert: CintaHighWeb5xxRate
        expr: |
          (
            sum(rate(cinta_web_requests_total{status_group="5xx"}[5m]))
            /
            clamp_min(sum(rate(cinta_web_requests_total[5m])), 0.1)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Elevated 5xx rate on web traffic"
          description: "5xx responses exceeded 5% of web requests over 10 minutes."

      - alert: CintaAsyncQueueBacklogHigh
        expr: max(cinta_async_queue_backlog) > 20
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Async queue backlog is high"
          description: "Async queue backlog has stayed above 20 for at least 10 minutes."

      - alert: CintaAsyncWorkersMissing
        expr: (max(cinta_async_queue_backlog) > 0) and (max(cinta_async_workers_running) < 1)
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Async backlog present but no workers running"
          description: "There is queued async work while no async worker is reported as running."
