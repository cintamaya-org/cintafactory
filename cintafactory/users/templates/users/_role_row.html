<tr>
  <td>{{ obj.name }}</td>
  <td>{{ obj.slug }}</td>
  <td>
    {% if request.user.is_superuser or request.user.is_staff or request.user.role and request.user.role.slug == "comite-validation" %}
      <a href="{% url 'users:role_change' pk=obj.pk %}" class="btn-flat waves-effect">Modifier</a>
    {% else %}
      <span title="Aucune permission" style="color:#888;">—</span>
    {% endif %}
  </td>
</tr>
