{# Reusable loading indicator. Include it anywhere with {% include "components/_loading_spinner.html" %}. #}
{% load static %}

<style data-loading-spinner>
  .rotating-logo {
    width: 50px;
    height: 50px;
    animation: spinPause 1.2s ease-in-out infinite;
  }

  @keyframes spinPause {
    0%   { transform: rotate(0deg); }
    80%  { transform: rotate(360deg); }
    100% { transform: rotate(360deg); }
  }
</style>
<script>
  (function() {
    if (window.cLoadingSpinnerCSSIncluded) {
      var styles = document.querySelectorAll('style[data-loading-spinner]');
      if (styles.length) {
        styles[styles.length - 1].remove();
      }
      return;
    }
    window.cLoadingSpinnerCSSIncluded = true;
  })();
</script>
<img
  src="{% static 'imgs/cintamaya_logo_100px.png' %}"
  class="rotating-logo"
  alt="Logo en chargement"
  role="status"
  aria-live="polite"
  aria-busy="true"
/>
