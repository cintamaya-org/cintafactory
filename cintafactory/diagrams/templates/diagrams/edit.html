{% extends "diagrams/base.html" %}
{% load static %}
{% block title %}Modifier: {{ diagram.title }}{% endblock %}
{% block content %}
<h1>Modifier: {{ diagram.title }}</h1>

<form id="csrfForm">{% csrf_token %}</form>

<div id="editor-holder" style="height:80vh; border:1px solid #333; border-radius:12px; overflow:hidden; position:relative;">
  <div id="drawio-loading" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#fff;">
    {% include "components/_loading_spinner.html" %}
  </div>
  <iframe
    id="dio"
    style="width:100%;height:100%;border:0"
    src="https://embed.diagrams.net/?embed=1&ui=min&spin=0&proto=json&lang=fr&autosave=1&tabs=0&libs=general;uml;bpmn;flowchart;er;network;aws2;azure2;gcp;cisco;mockups;charts;business;tables;signs;ios">
  </iframe>
</div>

<div class="bar">
  <button id="btnSave" class="btn" type="button">Save</button>
  <a class="btn" href="{% url 'diagrams:detail' diagram.pk %}">Back</a>
</div>

<script>
const iframeEl = document.getElementById("dio");
const iframeWin = iframeEl.contentWindow;
const loaderEl = document.getElementById("drawio-loading");
const DRAWIO_ORIGIN = "https://embed.diagrams.net";
const DIAGRAM_XML = `{{ diagram.xml|escapejs }}`;
const SAVE_XML_URL = "{% url 'diagrams:save_xml' diagram.pk %}";
const SAVE_THUMB_URL = "{% url 'diagrams:save_thumbnail' diagram.pk %}";

function hideLoader() {
  if (loaderEl) {
    loaderEl.style.opacity = "0";
    loaderEl.style.pointerEvents = "none";
    window.setTimeout(() => loaderEl.remove(), 200);
  }
}

function getCSRF() {
  const input = document.querySelector('#csrfForm input[name=csrfmiddlewaretoken]');
  return input ? input.value : "";
}

function sendToDrawio(payload) {
  if (!iframeWin) return;
  iframeWin.postMessage(JSON.stringify(payload), DRAWIO_ORIGIN);
}

window.addEventListener("message", (evt) => {
  if (evt.origin !== DRAWIO_ORIGIN) return;

  let msg = evt.data;
  if (!msg) return;

  if (typeof msg === "string") {
    try {
      msg = JSON.parse(msg);
    } catch {
      return;
    }
  }

  if (typeof msg !== "object") return;

  if (msg.event === "init") {
    sendToDrawio({ action: "load", xml: DIAGRAM_XML || "<mxGraphModel/>" });
    sendToDrawio({ action: "configure", config: { autosave: 1 } });
    hideLoader();
  }

  if (msg.event === "save") {
    handleSave(msg.xml);
  }

  if (msg.event === "export" && msg.data) {
    fetch(SAVE_THUMB_URL, {
      method: "POST",
      credentials: "same-origin",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": getCSRF(),
      },
      body: JSON.stringify({ data_uri: msg.data }),
    }).catch(console.error);
  }
});

document.getElementById("btnSave").addEventListener("click", () => {
  sendToDrawio({ action: "save" });
});

iframeEl.addEventListener("load", () => window.setTimeout(hideLoader, 5000));

async function handleSave(xml) {
  try {
    await fetch(SAVE_XML_URL, {
      method: "POST",
      credentials: "same-origin",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": getCSRF(),
      },
      body: JSON.stringify({ xml }),
    });

    sendToDrawio({ action: "export", format: "png", scale: 1, grid: 0 });
  } catch (e) {
    console.error(e);
  }
}
</script>
{% endblock %}
