cat << 'EOF' > k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cintafactory-deployment
  labels:
    app: cintafactory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cintafactory
  template:
    metadata:
      labels:
        app: cintafactory
    spec:
      containers:
        - name: cintafactory
          image: ghcr.io/cintamaya-holding/cintafactory:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: cintafactory-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
EOF
