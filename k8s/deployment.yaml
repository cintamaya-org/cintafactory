apiVersion: apps/v1
kind: Deployment
metadata:
  name: cintafactory-deployment
  labels:
    app: cintafactory
spec:
  replicas: 5
  selector:
    matchLabels:
      app: cintafactory
  template:
    metadata:
      labels:
        app: cintafactory
    spec:
      containers:
        - name: cintafactory
          image: __IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: cintafactory-config
            - configMapRef:
                name: cintafactory-app-config
            - secretRef:
                name: cintafactory-secrets
          env:
            - name: WEB_CONCURRENCY
              value: "4"
          resources:
            requests:
              cpu: "1000m"
              memory: "800Mi"
            limits:
              cpu: "4000m"
              memory: "1200Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
