version: "3.9"

services:
  web:
    ports:
      - "${PROD_HTTP_PORT:-8100}:8050"
    environment:
      DJANGO_SECRET_KEY: "${PROD_DJANGO_SECRET_KEY:?Set PROD_DJANGO_SECRET_KEY in deploy/env/prod.env}"
      DJANGO_ALLOWED_HOSTS: "${PROD_ALLOWED_HOSTS:-example.com}"
      DJANGO_DEBUG: "0"
    volumes:
      - cinta_prod_static:/archifactory/cintafactory/staticfiles
      - cinta_prod_media:/archifactory/cintafactory/media

volumes:
  cinta_prod_static:
  cinta_prod_media:
