services:
  web:
    build:
      context: ./cintafactory
    container_name: test_factory_dev_web
    environment:
      DJANGO_SETTINGS_MODULE: cintafactory.settings
      DEBUG: 1
      DATABASE_HOST: test_factory_db
      DATABASE_PORT: 5432
      DATABASE_NAME: test_factory_db
      DATABASE_USER: test_factory_user
      DATABASE_PASSWORD: test_factory_pass
      RUN_MIGRATIONS: 1
      SEAWEEDFS_FILER_URL: ${SEAWEEDFS_FILER_URL:-http://seaweedfs:8888}
      SEAWEEDFS_PUBLIC_URL: ${SEAWEEDFS_PUBLIC_URL:-http://seaweedfs:8888}
      SEAWEEDFS_BASE_DIR: ${SEAWEEDFS_BASE_DIR:-media}
      SEAWEEDFS_TIMEOUT: ${SEAWEEDFS_TIMEOUT:-30}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT:-30}
      CLAMAV_SCAN_DIR: ${CLAMAV_SCAN_DIR:-/clamav_scan}
      DRAWIO_BASE_URL: ${DRAWIO_BASE_URL:-http://drawio:8080}
      DRAWIO_PUBLIC_URL: ${DRAWIO_PUBLIC_URL:-http://localhost:8102}
      DRAWIO_LIBS: ${DRAWIO_LIBS:-general}
      DRAWIO_CLIBS: ${DRAWIO_CLIBS:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      LIKEC4_METADATA_TOKEN: ${LIKEC4_METADATA_TOKEN:-}
    volumes:
      # IMPORTANT: mount your app folder (which contains manage.py AND templates/)
      - ./cintafactory:/app
      - clamav_scan:/clamav_scan
    ports:
      - "8101:8000"
    command: python manage.py runserver 0.0.0.0:8000

  db:
    image: postgres:16
    container_name: test_factory_db
    environment:
      POSTGRES_DB: test_factory_db
      POSTGRES_USER: test_factory_user
      POSTGRES_PASSWORD: test_factory_pass
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  drawio:
    image: jgraph/drawio
    container_name: test_factory_drawio
    environment:
      EXPORT_URL: http://drawio-export:8000/export
    ports:
      - "${DRAWIO_HOST_PORT:-8102}:8080"
    depends_on:
      - drawio-export

  drawio-export:
    image: jgraph/export-server
    container_name: test_factory_drawio_export
    ports:
      - "${DRAWIO_EXPORT_HOST_PORT:-8103}:8000"

  likec4:
    image: likec4-cli
    container_name: test_factory_likec4
    build:
      context: ./likec4
      dockerfile: Dockerfile
      args:
        GRAPHVIZ_VERSION: ${LIKEC4_GRAPHVIZ_VERSION:-}
        PLAYWRIGHT_VER: ${LIKEC4_PLAYWRIGHT_VER:-}
        LIKEC4_VER: ${LIKEC4_VER:-}
    entrypoint: ["/bin/sh", "-c"]
    command: ["node server.js & mkdir -p ${LIKEC4_PREVIEW_DIR:-/tmp/likec4-previews} && touch ${LIKEC4_PREVIEW_DIR:-/tmp/likec4-previews}/bootstrap.c4 && /usr/local/bin/likec4 dev ${LIKEC4_PREVIEW_DIR:-/tmp/likec4-previews} --host 0.0.0.0"]
    environment:
      C4_FILE: ${LIKEC4_C4_FILE:-likec4/default.c4}
      LIKEC4_EDITOR_PORT: ${LIKEC4_EDITOR_PORT:-4173}
      LIKEC4_PREVIEW_DIR: ${LIKEC4_PREVIEW_DIR:-/tmp/likec4-previews}
      SEAWEEDFS_FILER_URL: ${SEAWEEDFS_FILER_URL:-http://seaweedfs:8888}
      SEAWEEDFS_BASE_DIR: ${SEAWEEDFS_BASE_DIR:-media}
      LIKEC4_METADATA_URL: http://web:8000/diagrams/likec4/metadata/
      LIKEC4_METADATA_TOKEN: ${LIKEC4_METADATA_TOKEN:-}
    ports:
      - "${LIKEC4_DEV_HOST_PORT:-5173}:5173"
      - "${LIKEC4_HMR_HOST_PORT:-24678}:24678"
      - "${LIKEC4_EDITOR_HOST_PORT:-4173}:4173"
    volumes:
      - ./likec4:/data

  clamav:
    image: clamav/clamav:latest
    container_name: test_factory_clamav
    ports:
      - "${CLAMAV_HOST_PORT:-3310}:3310"
    volumes:
      - clamav_scan:/clamav_scan

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: test_factory_seaweedfs
    command: "server -dir=/data -master -volume -filer"
    ports:
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"
      - "${SEAWEEDFS_FILER_PORT:-8888}:8888"
      - "${SEAWEEDFS_VOLUME_PORT:-8080}:8080"
    volumes:
      - seaweedfs_data:/data

volumes:
  pgdata_dev:
  seaweedfs_data:
  clamav_scan:
