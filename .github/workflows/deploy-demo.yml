name: Deploy DEMO (demo_factory)

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  deploy:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repo to VPS (/opt/cintafactory/demo)
        shell: bash
        run: |
          set -euo pipefail
          DEST="/opt/cintafactory/demo"

          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ${DEST} && find ${DEST} -mindepth 1 -maxdepth 1 -exec rm -rf {} +"

          tar --exclude=".git" --exclude=".github" -czf - . | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd ${DEST} && tar -xzf -"

      - name: Deploy on VPS (docker compose up -d) as demo_factory
        shell: bash
        env:
          DEMO_DJANGO_SECRET_KEY: ${{ secrets.DEMO_DJANGO_SECRET_KEY }}
          DEMO_LIKEC4_METADATA_TOKEN: ${{ secrets.DEMO_LIKEC4_METADATA_TOKEN }}
          DEMO_LIKEC4_API_TOKEN: ${{ secrets.DEMO_LIKEC4_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${DEMO_DJANGO_SECRET_KEY:?Missing DEMO_DJANGO_SECRET_KEY secret}"

          DEMO_DJANGO_SECRET_KEY_B64="$(printf '%s' "${DEMO_DJANGO_SECRET_KEY}" | base64 -w0)"
          DEMO_LIKEC4_METADATA_TOKEN_B64="$(printf '%s' "${DEMO_LIKEC4_METADATA_TOKEN}" | base64 -w0)"
          DEMO_LIKEC4_API_TOKEN_B64="$(printf '%s' "${DEMO_LIKEC4_API_TOKEN}" | base64 -w0)"

          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "DEMO_DJANGO_SECRET_KEY_B64='${DEMO_DJANGO_SECRET_KEY_B64}' DEMO_LIKEC4_METADATA_TOKEN_B64='${DEMO_LIKEC4_METADATA_TOKEN_B64}' DEMO_LIKEC4_API_TOKEN_B64='${DEMO_LIKEC4_API_TOKEN_B64}' bash -se" <<'REMOTE'
            set -euo pipefail
            docker network inspect swag-network >/dev/null 2>&1 || docker network create swag-network
            cd /opt/cintafactory/demo

            # === Variables de la stack DEMO (demo_factory) ===
            export APP_NAME="demo_factory"
            export DJANGO_SETTINGS_MODULE="cintafactory.settings"
            export APP_MODULE="cintafactory.wsgi:application"
            export DEBUG=0
            export SECRET_KEY="$(printf '%s' "${DEMO_DJANGO_SECRET_KEY_B64}" | base64 -d)"
            export LIKEC4_METADATA_TOKEN="$(printf '%s' "${DEMO_LIKEC4_METADATA_TOKEN_B64}" | base64 -d)"
            export LIKEC4_API_TOKEN="$(printf '%s' "${DEMO_LIKEC4_API_TOKEN_B64}" | base64 -d)"
            export ALLOWED_HOSTS="*"
            export APP_PORT=8000
            export HOST_PORT=8102          # HTTP externe app DEMO
            export POSTGRES_DB="demo_factory_db"
            export POSTGRES_USER="demo_factory_user"
            export POSTGRES_PASSWORD="demo_factory_pass"
            export DB_HOST_PORT=5434       # TCP externe Postgres DEMO
            export DATABASE_HOST="${APP_NAME}_db"
            export DATABASE_PORT="5432"

            docker compose -p "${APP_NAME}" up -d --build
          REMOTE
