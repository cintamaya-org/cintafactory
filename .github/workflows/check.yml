name: SBOM & Vulnerabilitées Scan

on:
  pull_request:
    branches: [ main, dev ]

env:
  PATH:/home/debian/\${{ github.repository }}

jobs:
  scan:
    runs-on: [ self-hosted ]

    steps:

      # Récupère le code source du repo sur le runner
      - name: Importation du repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # 4.3.1
        with:
          clean: true

      # Génère la date du jour      
      - name: Génération de la Date
        run: echo "DATE=$(date +%d-%m-%Y)" >> "$GITHUB_ENV"

      # Création des dossier /nom du repo/syft et /nom du repo/grype s'ils sont inexistant
      - name : Création des dossiers de destinations
        run: mkdir -p PATH/syft PATH/grype PATH/grant

      # Génération SBOM
      - name: Génération du SBOM
        run: |
          syft dir:. -o cyclonedx-json > PATH/syft/${DATE}_SBOM.json

      # Mise à jour de la base de donnée Grype 
      - name: Mise à jour de la db Grype
        run : grype db update

      # Recherche les vulnérabilites associées au sbom
      - name: Scan vulnerabilities with Grype
        run: |
          grype sbom:PATH/syft/${DATE}_SBOM.json -o table > PATH/grype/${DATE}_SCA.txt
      # Vérification de compliance avec grant
      - name: Vérifier les licences
        run: |
           grant list PATH/syft/${DATE}_SBOM.json > PATH/grant/${DATE}_LICENSE.txt
