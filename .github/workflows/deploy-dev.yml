name: Deploy DEV (test_factory)

on:
  pull_request:
    branches: [ "dev" ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  deploy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repo to VPS (/opt/cintafactory/test)
        shell: bash
        run: |
          set -euo pipefail
          DEST="/opt/cintafactory/test"

          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ${DEST} && find ${DEST} -mindepth 1 -maxdepth 1 -exec rm -rf {} +"

          tar --exclude=".git" --exclude=".github" -czf - . | ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "cd ${DEST} && tar -xzf -"

      - name: Deploy on VPS (docker compose up -d) as test_factory
        shell: bash
        env:
          DEV_DJANGO_SECRET_KEY: ${{ secrets.DEV_DJANGO_SECRET_KEY }}
          DEV_LIKEC4_METADATA_TOKEN: ${{ secrets.DEV_LIKEC4_METADATA_TOKEN }}
          DEV_LIKEC4_API_TOKEN: ${{ secrets.DEV_LIKEC4_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${DEV_DJANGO_SECRET_KEY:?Missing DEV_DJANGO_SECRET_KEY secret}"

          DEV_DJANGO_SECRET_KEY_B64="$(printf '%s' "${DEV_DJANGO_SECRET_KEY}" | base64 -w0)"
          DEV_LIKEC4_METADATA_TOKEN_B64="$(printf '%s' "${DEV_LIKEC4_METADATA_TOKEN}" | base64 -w0)"
          DEV_LIKEC4_API_TOKEN_B64="$(printf '%s' "${DEV_LIKEC4_API_TOKEN}" | base64 -w0)"

          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "DEV_DJANGO_SECRET_KEY_B64='${DEV_DJANGO_SECRET_KEY_B64}' DEV_LIKEC4_METADATA_TOKEN_B64='${DEV_LIKEC4_METADATA_TOKEN_B64}' DEV_LIKEC4_API_TOKEN_B64='${DEV_LIKEC4_API_TOKEN_B64}' bash -se" <<'REMOTE'
            set -euo pipefail
            docker network inspect swag-network >/dev/null 2>&1 || docker network create swag-network
            cd /opt/cintafactory/test

            # === Variables de la stack DEV (test_factory) ===
            export APP_NAME="test_factory"
            export DJANGO_SETTINGS_MODULE="cintafactory.settings"
            export APP_MODULE="cintafactory.wsgi:application"
            export DEBUG=1
            export SECRET_KEY="$(printf '%s' "${DEV_DJANGO_SECRET_KEY_B64}" | base64 -d)"
            export LIKEC4_METADATA_TOKEN="$(printf '%s' "${DEV_LIKEC4_METADATA_TOKEN_B64}" | base64 -d)"
            export LIKEC4_API_TOKEN="$(printf '%s' "${DEV_LIKEC4_API_TOKEN_B64}" | base64 -d)"
            export ALLOWED_HOSTS="*"
            export APP_PORT=8000
            export HOST_PORT=8101          # HTTP externe app DEV
            export POSTGRES_DB="test_factory_db"
            export POSTGRES_USER="test_factory_user"
            export POSTGRES_PASSWORD="test_factory_pass"
            export DB_HOST_PORT=5433       # TCP externe Postgres DEV
            # Connexions internes conteneurs -> db
            export DATABASE_HOST="${APP_NAME}_db"
            export DATABASE_PORT="5432"

            docker compose -p "${APP_NAME}" up -d --build
          REMOTE
