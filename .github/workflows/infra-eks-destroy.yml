name: "EKS Infra Destroy"

# TEMPORAIRE (testing) : déclenché par push sur dev-Abd au lieu de workflow_dispatch,
# car workflow_dispatch n'est utilisable que si ce fichier existe sur la branche par
# défaut du repo (main), ce qu'on veut éviter pour ce test ponctuel.
# -> Désactiver ce workflow (Actions > EKS Infra Destroy > ... > Disable workflow)
#    juste après l'avoir utilisé, pour ne pas redétruire l'infra dev à chaque push.
on:
  push:
    branches:
      - dev-Abd
    paths:
      - ".github/workflows/infra-eks-destroy.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev-Abd
  cancel-in-progress: false

jobs:
  destroy-plan:
    name: "Terraform Destroy Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
      backend_key: ${{ steps.env.outputs.backend_key }}
      cluster_name: ${{ steps.env.outputs.cluster_name }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Déterminer l'environnement
        id: env
        run: |
          # Codé en dur sur dev pour ce test ponctuel (déclenché par push, pas par
          # workflow_dispatch, donc pas d'input à lire).
          echo "env_name=dev" >> "$GITHUB_OUTPUT"
          echo "backend_key=eks/dev/terraform.tfstate" >> "$GITHUB_OUTPUT"
          echo "cluster_name=cintafactory-poc-dev" >> "$GITHUB_OUTPUT"

      - name: Authentification AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::512584596480:role/github-actions-eks-role
          aws-region: eu-west-3

      - name: Installation de Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        run: terraform init -input=false -backend-config="key=${{ steps.env.outputs.backend_key }}"

      - name: Terraform Destroy Plan
        run: |
          terraform plan -destroy -input=false -out=tfplan-destroy \
            -var "environment=${{ steps.env.outputs.env_name }}" \
            -var "cluster_name=${{ steps.env.outputs.cluster_name }}"

      - name: Upload du plan de destruction
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-destroy-${{ steps.env.outputs.env_name }}-${{ github.run_id }}
          path: terraform/tfplan-destroy
          retention-days: 3

  destroy-apply-dev:
    name: "Terraform Destroy Apply (dev, sans gate)"
    needs: destroy-plan
    if: needs.destroy-plan.outputs.env_name == 'dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Authentification AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::512584596480:role/github-actions-eks-role
          aws-region: eu-west-3

      - name: Installation de Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Download du plan de destruction
        uses: actions/download-artifact@v4
        with:
          name: tfplan-destroy-${{ needs.destroy-plan.outputs.env_name }}-${{ github.run_id }}
          path: terraform

      - name: Terraform Init
        run: terraform init -input=false -backend-config="key=${{ needs.destroy-plan.outputs.backend_key }}"

      - name: Terraform Destroy Apply
        run: terraform apply tfplan-destroy

  destroy-apply-gated:
    name: "Terraform Destroy Apply (staging/production, avec approbation)"
    needs: destroy-plan
    if: needs.destroy-plan.outputs.env_name != 'dev'
    environment: ${{ needs.destroy-plan.outputs.env_name == 'staging' && 'test' || 'production' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Authentification AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::512584596480:role/github-actions-eks-role
          aws-region: eu-west-3

      - name: Installation de Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Download du plan de destruction
        uses: actions/download-artifact@v4
        with:
          name: tfplan-destroy-${{ needs.destroy-plan.outputs.env_name }}-${{ github.run_id }}
          path: terraform

      - name: Terraform Init
        run: terraform init -input=false -backend-config="key=${{ needs.destroy-plan.outputs.backend_key }}"

      - name: Terraform Destroy Apply
        run: terraform apply tfplan-destroy
