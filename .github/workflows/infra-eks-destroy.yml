name: "EKS Infra Destroy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement à détruire"
        type: choice
        required: true
        options:
          - dev
          - staging
          - production
      confirm_cluster_name:
        description: "Nom exact du cluster à détruire (garde-fou anti-typo)"
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.event.inputs.environment == 'dev' && 'dev-Abd' || (github.event.inputs.environment == 'staging' && 'staging' || 'main') }}
  cancel-in-progress: false

jobs:
  destroy-plan:
    name: "Terraform Destroy Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
      backend_key: ${{ steps.env.outputs.backend_key }}
      cluster_name: ${{ steps.env.outputs.cluster_name }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Déterminer l'environnement
        id: env
        run: |
          case "${{ github.event.inputs.environment }}" in
            dev)
              CLUSTER_NAME=cintafactory-poc-dev
              ;;
            staging)
              CLUSTER_NAME=cintafactory-poc-staging
              ;;
            production)
              CLUSTER_NAME=cintafactory-poc-production
              ;;
            *)
              echo "Environnement non géré: ${{ github.event.inputs.environment }}"
              exit 1
              ;;
          esac
          echo "env_name=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          echo "backend_key=eks/${{ github.event.inputs.environment }}/terraform.tfstate" >> "$GITHUB_OUTPUT"
          echo "cluster_name=${CLUSTER_NAME}" >> "$GITHUB_OUTPUT"

      - name: Vérification du nom de cluster fourni
        run: |
          if [ "${{ github.event.inputs.confirm_cluster_name }}" != "${{ steps.env.outputs.cluster_name }}" ]; then
            echo "Le nom fourni (${{ github.event.inputs.confirm_cluster_name }}) ne correspond pas au cluster de l'environnement '${{ github.event.inputs.environment }}' (${{ steps.env.outputs.cluster_name }})."
            exit 1
          fi

      - name: Authentification AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::512584596480:role/github-actions-eks-role
          aws-region: eu-west-3

      - name: Installation de Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        run: terraform init -input=false -backend-config="key=${{ steps.env.outputs.backend_key }}"

      - name: Terraform Destroy Plan
        run: |
          terraform plan -destroy -input=false -out=tfplan-destroy \
            -var "environment=${{ steps.env.outputs.env_name }}" \
            -var "cluster_name=${{ steps.env.outputs.cluster_name }}"

      - name: Upload du plan de destruction
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-destroy-${{ steps.env.outputs.env_name }}-${{ github.run_id }}
          path: terraform/tfplan-destroy
          retention-days: 3

  destroy-apply-dev:
    name: "Terraform Destroy Apply (dev, sans gate)"
    needs: destroy-plan
    if: needs.destroy-plan.outputs.env_name == 'dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Authentification AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::512584596480:role/github-actions-eks-role
          aws-region: eu-west-3

      - name: Installation de Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Download du plan de destruction
        uses: actions/download-artifact@v4
        with:
          name: tfplan-destroy-${{ needs.destroy-plan.outputs.env_name }}-${{ github.run_id }}
          path: terraform

      - name: Terraform Init
        run: terraform init -input=false -backend-config="key=${{ needs.destroy-plan.outputs.backend_key }}"

      - name: Terraform Destroy Apply
        run: terraform apply tfplan-destroy

  destroy-apply-gated:
    name: "Terraform Destroy Apply (staging/production, avec approbation)"
    needs: destroy-plan
    if: needs.destroy-plan.outputs.env_name != 'dev'
    environment: ${{ needs.destroy-plan.outputs.env_name == 'staging' && 'test' || 'production' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Authentification AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::512584596480:role/github-actions-eks-role
          aws-region: eu-west-3

      - name: Installation de Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Download du plan de destruction
        uses: actions/download-artifact@v4
        with:
          name: tfplan-destroy-${{ needs.destroy-plan.outputs.env_name }}-${{ github.run_id }}
          path: terraform

      - name: Terraform Init
        run: terraform init -input=false -backend-config="key=${{ needs.destroy-plan.outputs.backend_key }}"

      - name: Terraform Destroy Apply
        run: terraform apply tfplan-destroy
