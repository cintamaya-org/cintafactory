name: "Tests unitaires"

# Flux de branches du projet : dev-<prénom> -> dev -> main.
# `dev` est la branche d'intégration : sans elle dans les déclencheurs, le
# workflow ne se déclenche jamais pour les autres branches de développement.
on:
  push:
    branches:
      - main
      - dev
      - dev-Abd
    paths:
      - "cintafactory/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"
  pull_request:
    # Pas de filtre `paths` ici : une PR est testée quelle que soit sa nature.
    branches:
      - main
      - dev
      - dev-Abd
  # Permet à un workflow de build d'appeler celui-ci et d'en dépendre
  # (`needs:`), pour ne publier une image que si la suite est verte.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: "Django — tests applicatifs"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cintafactory_test
          POSTGRES_USER: cintafactory
          POSTGRES_PASSWORD: cintafactory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cintafactory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-used-in-production
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_NAME: cintafactory_test
      DATABASE_USER: cintafactory
      DATABASE_PASSWORD: cintafactory
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          # Requis par SonarQube pour attribuer les problèmes aux bons commits.
          fetch-depth: 0

      - name: Installation de uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `--locked` échoue si uv.lock ne correspond plus à pyproject.toml, qui
      # fait foi. Impose de rejouer `uv lock` après toute modification des
      # dépendances, au lieu d'installer silencieusement d'anciennes versions.
      # Installe aussi le groupe `dev` (coverage).
      - name: Installation des dépendances
        run: uv sync --locked

      - name: Vérification de la configuration Django
        run: uv run python cintafactory/manage.py check

      - name: Vérification de la dérive des migrations
        run: uv run python cintafactory/manage.py makemigrations --check --dry-run

      # Périmètre complet : le label `cintafactory` couvre cintafactory/tests.py
      # (middleware, rate-limit, CSP, checks sécurité, storage, upload) et
      # cintafactory/tests_ops/ (health, alerting, async jobs, backup DR,
      # scaling, load testing). Ces tests sont entièrement mockés : ils ne
      # demandent ni ClamAV ni SeaweedFS.
      #
      # Le périmètre *mesuré* par coverage est défini dans pyproject.toml
      # ([tool.coverage.run]) et non ici : une exécution locale produit donc
      # exactement les mêmes chiffres que la CI.
      - name: Tests unitaires applicatifs
        run: >-
          uv run coverage run cintafactory/manage.py test
          cintafactory dat users workflows diagrams configuration
          --verbosity 2 --noinput

      # coverage.xml est le fichier sur lequel SonarQube se base. Produit même
      # si des tests échouent, pour que le scan reste exploitable.
      - name: Rapport de couverture
        if: always()
        run: |
          uv run coverage xml -o coverage.xml
          uv run coverage report

      - name: Archivage du rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          retention-days: 14

      # Le scan tourne ici, et pas dans Check_code.yml, parce que coverage.xml
      # doit être présent sur le disque au moment de l'analyse : un artefact
      # publié dans un autre workflow ne serait pas visible.
      - name: SonarQube
        if: always()
        uses: sonarsource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # 8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
