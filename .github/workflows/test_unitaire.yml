name: Django Unit Tests

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run Django Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine@sha256:a69cefa2b52ec1d440ad88dcba38bf4ff432328135017e2cc45bfe428e219fb0 # version figée
        env:
          POSTGRES_DB: cintafactory_test_db
          POSTGRES_USER: cintafactory_user
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ephemeral-ci-pass-only' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # actions/checkout@v4.2.2 (épinglé par commit SHA)
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false # Ne persiste pas le GITHUB_TOKEN sur le disque du runner

      # astral-sh/setup-uv@v5.1.0
      - name: Install uv
        uses: astral-sh/setup-uv@f94e3d4e8e11718612a219a1a2d4174473370f9d
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Django Tests with dynamic secrets
        working-directory: ./cintafactory
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: cintafactory_test_db
          DB_USER: cintafactory_user
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ephemeral-ci-pass-only' }}
          DEBUG: "False"
        run: |
          export SECRET_KEY=$(openssl rand -hex 32)
          uv run python manage.py test --verbosity 2
