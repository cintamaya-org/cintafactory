[project]
name = "cintafactory"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
  "Django==5.2.16",
  "python-dotenv==1.2.2",
  "asgiref==3.11.1",
  "click==8.4.2",
  "colorama==0.4.6",
  "cryptography==49.0.0",
  "django-extensions==4.1",
  "django-workflow==1.6",
  "dotfile==0.9.0",
  "djangorestframework==3.17.1",
  "drf-spectacular==0.30.0",
  "defusedxml==0.7.1",
  "graphviz==0.21",
  "six==1.17.0",
  "sqlparse==0.5.5",
  "toml==0.10.2",
  "tzdata==2026.2",
  "django-viewflow==2.2.15",
  "django-material==1.12.0",
  "django-oauth-toolkit==3.3.0 ",
  "gunicorn==26.0.0",
  "psycopg2-binary==2.9.12",
  "whitenoise==6.12.0",
  "Pillow==12.2.0",
  "requests==2.34.2",
  "WeasyPrint==69.0",
  "pydyf>=0.10.0,<0.12",
]

[tool.uv]
package = false

# Outillage de test, installé par `uv sync` mais absent de l'image de production.
[dependency-groups]
dev = [
  "coverage[toml]>=7.6",
]

# Partagé entre la CI et les exécutions locales : le rapport envoyé à SonarQube
# mesure donc exactement le même périmètre que ce qu'un développeur voit.
[tool.coverage.run]
source = ["cintafactory"]
branch = true
# Chemins relatifs à la racine du dépôt (cintafactory/dat/views.py plutôt que
# dat/views.py) : c'est ce que SonarQube attend, sonar.sources valant
# "cintafactory". Sans cette option, il ne rattache la couverture à aucun fichier.
relative_files = true
omit = [
  "*/migrations/*",
  "*/tests.py",
  "*/tests_*.py",
  "*/tests_ops/*",
  "*/manage.py",
  "*/settings.py",
  "*/wsgi.py",
  "*/asgi.py",
]

[tool.coverage.report]
skip_empty = true
